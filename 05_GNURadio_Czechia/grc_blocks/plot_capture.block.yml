id: plot_capture
label: Plot Capture
category: '[Appendix GNURadio]'
flags: [ python ]

parameters:
-   id: type
    label: Input Type
    dtype: enum
    options: [complex, float, int, short, byte]
    option_attributes:
        pyname: ["'complex'", "'float'", "'int'", "'short'", "'byte'"]
    hide: part
-   id: samp_rate
    label: Sample Rate
    dtype: real
    default: samp_rate
-   id: nsamples
    label: Capture Samples
    dtype: int
    default: '200000'
-   id: skip
    label: Skip (settling)
    dtype: int
    default: '0'
    hide: part
-   id: mode
    label: Plot Mode
    dtype: string
    default: all
    hide: part
-   id: sps
    label: Samples/Symbol (eye)
    dtype: int
    default: '0'
    hide: part
-   id: nfft
    label: FFT Size (psd/spec)
    dtype: int
    default: '1024'
    hide: part
-   id: out_dir
    label: Output Dir
    dtype: string
    default: Figure
    hide: part
-   id: prefix
    label: Filename Prefix
    dtype: string
    default: plot
-   id: title
    label: Title
    dtype: string
    default: ''
    hide: part
-   id: save_npy
    label: Also Save .npy
    dtype: bool
    default: 'False'
    options: ['True', 'False']
    hide: part

inputs:
-   domain: stream
    dtype: ${ type }

asserts:
- ${ nsamples > 0 }

templates:
    imports: import gr_plot_capture
    make: |-
        gr_plot_capture.plot_capture(
            dtype=${type.pyname}, samp_rate=${samp_rate}, nsamples=${nsamples},
            skip=${skip}, mode=${mode}, sps=${sps}, nfft=${nfft},
            out_dir=${out_dir}, prefix=${prefix}, title=${title},
            save_npy=${save_npy})

documentation: |-
    gr_plot_capture.py and gr_plot_sink.py (the REAL implementation this block
    imports) live in grc_blocks/, not next to the generated flowgraph .py, so
    plain `import gr_plot_capture` above would normally fail (it only finds a
    sibling file in the same directory as the flowgraph, which this no longer
    is). DELIBERATELY NOT fixed by changing this block's own `imports`
    template (tried that 2026-08-31; GNU Radio Companion only re-scans
    local_blocks_path at STARTUP, so any edit here needs a full GRC restart to
    take effect, and even a restart did not reliably pick it up in practice --
    fragile). Fixed instead with a tiny SHIM file, <flowgraph_dir>/gr_plot_capture.py
    (2 lines: sys.path.insert(grc_blocks) then `from grc_blocks.gr_plot_capture
    import *`) -- so the plain `import gr_plot_capture` this block has always
    emitted just works, unconditionally, regardless of which cached version of
    THIS yml file GRC used to generate the flowgraph. If gr_plot_capture.py
    ever moves again, update the shim, not this template.

    Captures `nsamples` items from this input (after skipping `skip`), then
    -- called from a Python Snippet (section 'Main - After Stop') as
    `self.<name>.plot()` -- renders them to a timestamped PNG under `out_dir`.
    No File Sink, no second script.

    `mode` is a comma-separated panel list, or an alias: all (time,psd,spec),
    rf (psd,spec), af (time,psd,eye). Panels: time, psd, spec, hist, iq, eye.
    `sps` is only needed for the eye panel. `plot()` accepts overriding kwargs
    from the Snippet, e.g. self.plotcap_iq.plot(mode='iq').

    For "one PNG every N seconds until the signal runs out" instead of a
    single shot at the end, call from two Snippets instead of using `plot()`:
      Main - After Start: self.<name>.start_periodic_plot(30)
      Main - After Stop:  self.<name>.stop_periodic_plot(flush_partial=True)

    Internally this is Head(nsamples) -> Vector Sink, both plain C++ blocks --
    see gr_plot_capture.py for why that matters on this project's radioconda
    install (streaming Python blocks segfault there).

file_format: 1
